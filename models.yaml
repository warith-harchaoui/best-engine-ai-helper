# Bundled seed catalog. Hand-maintained before each release.
# Auto-refresh (catalog update) adds entries to
# ~/.best-engine-ai-helper/catalog_cache.yaml without modifying this file.
#
# Fields:
#   id          Ollama pull tag (name:tag)
#   kind        llm | vlm  (VLM implies text capability too)
#   size_b      Parameter count in billions
#   quant       Quantization: Q4_K_M | Q8_0 | FP16 | Q2_K
#   disk_gb     On-disk footprint in GB
#   ram_gb      Peak inference RAM estimate (disk_gb × quant overhead)
#   benchmarks  Scores from public leaderboards (null = not measured)
#     general   Open LLM Leaderboard v2 average (IFEval+BBH+MATH+GPQA+MUSR+MMLU-Pro)
#     vision    OpenVLM Leaderboard average
#     ocr       OCRBench
#     code      EvalPlus HumanEval+
#     math      MATH sub-score from Open LLM Leaderboard v2
#   vllm_id     HuggingFace model ID for vLLM, null if unavailable
#   fetched_at  ISO 8601 date of last external refresh; null = bundled seed

