<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 478" width="1040" height="478"
     role="img" aria-labelledby="ts-title ts-desc" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="ts-title">How the paid catalogue grows: two sources, and an entry needs both</title>
  <desc id="ts-desc">Two independent sources feed the paid model catalogue, measured on 28 October
  2026. On one side a public price table lists 188 chat models you can actually buy, with a list
  price, a context length and capability flags, and no quality score at all. On the other, a
  community mirror of a human-preference leaderboard publishes 37 model names from a snapshot dated
  7 October 2026, three boards of twenty, with a rating and no price. A model is admitted to the
  catalogue only where both sources name it: that is two citations, neither of them invented.
  Eighteen models pass today. One hundred and sixty-four are priced but unrated, so they are printed
  for a human to triage rather than added, because a model with no score cannot be ranked. Four
  entries already in the catalogue are unknown to the price source, which is strong evidence of
  retirement but not proof, so they are reported and left exactly as they were. The catalogue goes
  from ten models from 2024 to twenty-eight.</desc>

  <style>
    .panel      { fill: #ffffff; stroke: #e0e0e0; stroke-width: 1.5; }
    .eyebrow    { fill: #6b6b6b; font-size: 12px; font-weight: 700; letter-spacing: .1em; }
    .h          { font-size: 16px; font-weight: 700; fill: #111111; }
    .sub        { font-size: 12.5px; fill: #5a5a5a; }
    .muted      { font-size: 12px; fill: #8a8a8a; font-style: italic; }
    .mono       { font-family: 'Roboto Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    .count      { font-size: 25px; font-weight: 700; }
    .flow       { fill: none; stroke: #9a9a9a; stroke-width: 2; }

    .priced     { fill: #E5F1F8; stroke: #0072B2; stroke-width: 1.8; }
    .priced-k   { fill: #0072B2; }
    .rated      { fill: #DFF2EC; stroke: #009E73; stroke-width: 1.8; }
    .rated-k    { fill: #007254; }

    .gate       { fill: #FDF0E3; stroke: #E69F00; stroke-width: 2.2; }
    .gate-k     { fill: #8a5600; }

    .keep       { fill: #DFF2EC; stroke: #009E73; stroke-width: 1.8; }
    .keep-k     { fill: #007254; }
    .hold       { fill: #FFF9E6; stroke: #E69F00; stroke-width: 1.8; }
    .hold-k     { fill: #8a5600; }
    .leave      { fill: #FBEDE6; stroke: #D55E00; stroke-width: 1.8; }
    .leave-k    { fill: #9c4400; }

    .caption    { font-size: 12.5px; fill: #5a5a5a; font-style: italic; }

    @media (prefers-color-scheme: dark) {
      .panel    { fill: #1b1b1d; stroke: #3a3a3d; }
      .eyebrow  { fill: #a0a0a6; }
      .h        { fill: #f2f2f4; }
      .sub      { fill: #b4b4ba; }
      .muted    { fill: #8f8f96; }
      .flow     { stroke: #7a7a82; }
      .caption  { fill: #a0a0a6; }

      .priced   { fill: #10243d; stroke: #4da2ff; }
      .priced-k { fill: #7ab8ff; }
      .rated    { fill: #0d2a22; stroke: #3ec9a1; }
      .rated-k  { fill: #5fd9b6; }
      .gate     { fill: #33250d; stroke: #ffb52e; }
      .gate-k   { fill: #ffc85c; }
      .keep     { fill: #0d2a22; stroke: #3ec9a1; }
      .keep-k   { fill: #5fd9b6; }
      .hold     { fill: #33250d; stroke: #ffb52e; }
      .hold-k   { fill: #ffc85c; }
      .leave    { fill: #3a1f10; stroke: #ff8a3d; }
      .leave-k  { fill: #ff9f63; }
    }
  </style>

  <defs>
    <marker id="ts-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a9a9a"/>
    </marker>
  </defs>

  <!-- ===================== evidence ===================== -->
  <text class="eyebrow" x="28" y="34">WHAT EACH SOURCE KNOWS</text>

  <rect class="priced" x="28" y="52" width="372" height="134" rx="12"/>
  <text class="eyebrow priced-k" x="48" y="78">PRICED</text>
  <text class="h" x="48" y="102">LiteLLM public price table</text>
  <text class="sub mono" x="48" y="126">188 chat models you can buy</text>
  <text class="sub" x="48" y="146">list price · context length · vision · schema</text>
  <text class="muted" x="48" y="168">no quality score, by construction</text>

  <rect class="rated" x="28" y="212" width="372" height="134" rx="12"/>
  <text class="eyebrow rated-k" x="48" y="238">RATED</text>
  <text class="h" x="48" y="262">LM Arena community mirror</text>
  <text class="sub mono" x="48" y="286">37 names · snapshot 2026-10-07</text>
  <text class="sub" x="48" y="306">three boards, top twenty each</text>
  <text class="muted" x="48" y="328">no price, by construction</text>

  <!-- ===================== the gate ===================== -->
  <path class="flow" d="M404 119 H510 V134" marker-end="url(#ts-arrow)"/>
  <path class="flow" d="M404 279 H510 V264" marker-end="url(#ts-arrow)"/>

  <rect class="gate" x="434" y="142" width="152" height="114" rx="12"/>
  <text class="eyebrow gate-k" x="510" y="176" text-anchor="middle">ADMISSION</text>
  <text class="h" x="510" y="202" text-anchor="middle">both,</text>
  <text class="h" x="510" y="222" text-anchor="middle">or neither</text>
  <text class="muted" x="510" y="243" text-anchor="middle">two citations or no entry</text>

  <path class="flow" d="M590 199 H602"/>
  <path class="flow" d="M602 105 V341"/>
  <path class="flow" d="M602 105 H610" marker-end="url(#ts-arrow)"/>
  <path class="flow" d="M602 223 H610" marker-end="url(#ts-arrow)"/>
  <path class="flow" d="M602 341 H610" marker-end="url(#ts-arrow)"/>

  <!-- ===================== outcomes ===================== -->
  <text class="eyebrow" x="618" y="34">WHAT THE REFRESH DOES WITH IT</text>

  <rect class="keep" x="618" y="52" width="394" height="106" rx="12"/>
  <text class="count keep-k mono" x="642" y="88">18</text>
  <text class="h" x="700" y="86">adopted</text>
  <text class="sub" x="642" y="112">a price from one source, a rating from the other</text>
  <text class="muted" x="642" y="136">general · code · math stay null — nobody measured them</text>

  <rect class="hold" x="618" y="170" width="394" height="106" rx="12"/>
  <text class="count hold-k mono" x="642" y="206">164</text>
  <text class="h" x="712" y="204">printed for triage</text>
  <text class="sub" x="642" y="230">priced, and no leaderboard rates them</text>
  <text class="muted" x="642" y="254">listed, never added: an unscored model cannot be ranked</text>

  <rect class="leave" x="618" y="288" width="394" height="106" rx="12"/>
  <text class="count leave-k mono" x="642" y="324">4</text>
  <text class="h" x="678" y="322">left exactly as they were</text>
  <text class="sub" x="642" y="348">in the catalogue, unknown to the price source</text>
  <text class="muted" x="642" y="372">probably retired — strong evidence, not proof</text>

  <!-- ===================== result ===================== -->
  <rect class="panel" x="28" y="372" width="558" height="60" rx="10"/>
  <text class="h" x="52" y="398">The paid catalogue</text>
  <text class="sub mono" x="52" y="420">10 models from 2024  →  28, of which 18 carry a dated price and a dated rating</text>

  <text class="caption" x="28" y="462">Measured 2026-10-28 by scripts/measure_arena_coverage.py. Re-run it: the numbers move when either source does.</text>
</svg>
