<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1357 432" width="1357" height="432" role="img" aria-labelledby="beh-title beh-desc" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="beh-title">How best-engine-ai-helper works: this machine in, the largest model that actually fits out</title>
  <desc id="beh-desc">A left-to-right plate. In: the machine you are on, whatever it is. The work, in three numbered stages: the available memory is detected, the Apple Silicon unified pool, NVIDIA VRAM or plain RAM, and the part the driver will not hand out is subtracted along with headroom for the operating system and a growing cache; the bundled catalogue is ranked inside what is left, so a model that cannot fit is never proposed; and the winner is pulled through Ollama and gated on quality before it is declared usable. Out: the chosen model, an environment file downstream projects read, and an OpenAI-compatible endpoint where the model named auto resolves per request.</desc>
  <style>
    .panel      { fill: #ffffff; stroke: #d6d6d6; stroke-width: 1.5; }
    .panel-label{ fill: #6b6b6b; font-size: 13px; font-weight: 600; letter-spacing: .08em; }
    .io         { fill: #F8F8F8; stroke: #9a9a9a; stroke-width: 1.5; }
    .stage      { fill: #FFF4E0; stroke: #FF9500; stroke-width: 1.5; }
    .core       { fill: #007AFF; stroke: #0062CC; stroke-width: 1.5; }
    .surface    { fill: #EAF3FF; stroke: #007AFF; stroke-width: 1.5; }
    .n-title    { font-size: 15px; font-weight: 600; fill: #111111; }
    .n-sub      { font-size: 12px; fill: #5a5a5a; }
    .on-dark    { fill: #ffffff; font-size: 15px; font-weight: 600; }
    .on-dark-sub{ fill: #d8e8ff; font-size: 12px; }
    .flow       { fill: none; stroke: #9a9a9a; stroke-width: 2; }
    .tie        { fill: none; stroke: #007AFF; stroke-width: 1.5; }
    .caption    { font-size: 12.5px; fill: #5a5a5a; font-style: italic; }
    .step       { font-size: 11px; font-weight: 700; fill: #B26A00;
                  font-family: 'Roboto Mono', ui-monospace, monospace; }
    .surf-label { font-size: 13px; font-weight: 600; fill: #0062CC; }

    @media (prefers-color-scheme: dark) {
      .panel      { fill: #1b1b1d; stroke: #3a3a3d; }
      .panel-label{ fill: #a0a0a6; }
      .io         { fill: #2a2a2e; stroke: #6f6f76; }
      .stage      { fill: #3a2d12; stroke: #FF9500; }
      .surface    { fill: #10243d; stroke: #4da2ff; }
      .n-title    { fill: #f2f2f4; }
      .n-sub      { fill: #b4b4ba; }
      .flow       { stroke: #7a7a82; }
      .tie        { stroke: #4da2ff; }
      .caption    { fill: #a0a0a6; }
      .step       { fill: #FFCC00; }
      .surf-label { fill: #4da2ff; }
    }
  </style>
  <defs><marker id="ah-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a9a9a"/></marker></defs>
  <text class="panel-label" x="28" y="40">IN</text>
  <rect class="io" x="28" y="87" width="203" height="78" rx="10"/>
  <text class="n-title" x="129" y="120" text-anchor="middle">this machine</text>
  <text class="n-sub" x="129" y="139" text-anchor="middle">unified pool, VRAM or RAM</text>
  <path class="flow" d="M237 126 H253" marker-end="url(#ah-arrow)"/>
  <rect class="panel" x="257" y="54" width="823" height="144" rx="12"/>
  <text class="panel-label" x="277" y="76">WHAT IT DOES</text>
  <rect class="stage" x="277" y="94" width="243" height="78" rx="10"/>
  <text class="n-title" x="398" y="127" text-anchor="middle">measure the budget</text>
  <text class="n-sub" x="398" y="146" text-anchor="middle">pool minus driver minus headroom</text>
  <text class="step" x="288" y="110">1</text>
  <path class="flow" d="M524 133 H540" marker-end="url(#ah-arrow)"/>
  <rect class="stage" x="546" y="94" width="250" height="78" rx="10"/>
  <text class="n-title" x="671" y="127" text-anchor="middle">rank what fits</text>
  <text class="n-sub" x="671" y="146" text-anchor="middle">catalogue, inside the budget only</text>
  <text class="step" x="557" y="110">2</text>
  <path class="flow" d="M800 133 H816" marker-end="url(#ah-arrow)"/>
  <rect class="stage" x="822" y="94" width="237" height="78" rx="10"/>
  <text class="n-title" x="940" y="127" text-anchor="middle">pull + gate</text>
  <text class="n-sub" x="940" y="146" text-anchor="middle">Ollama, then prove it is usable</text>
  <text class="step" x="833" y="110">3</text>
  <path class="flow" d="M1085 126 H1101" marker-end="url(#ah-arrow)"/>
  <text class="panel-label" x="1105" y="40">OUT</text>
  <rect class="io" x="1105" y="87" width="224" height="78" rx="10"/>
  <text class="n-title" x="1217" y="120" text-anchor="middle">the model that fits</text>
  <text class="n-sub" x="1217" y="139" text-anchor="middle">pulled, gated, written to env</text>
  <rect class="core" x="463" y="232" width="431" height="54" rx="10"/>
  <text class="on-dark" x="678" y="253" text-anchor="middle">one library, called the same way everywhere</text>
  <text class="on-dark-sub" x="678" y="272" text-anchor="middle">os-helper underneath for logging and file management</text>
  <path class="tie" d="M678 286 V314 H414 V332"/>
  <path class="tie" d="M678 314 H942 V332"/>
  <path class="tie" d="M414 314 V332"/>
  <rect class="surface" x="339" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="414" y="360" text-anchor="middle">Python API</text>
  <path class="tie" d="M590 314 V332"/>
  <rect class="surface" x="515" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="590" y="360" text-anchor="middle">CLI (click)</text>
  <path class="tie" d="M766 314 V332"/>
  <rect class="surface" x="691" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="766" y="360" text-anchor="middle">FastAPI + MCP</text>
  <path class="tie" d="M942 314 V332"/>
  <rect class="surface" x="867" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="942" y="360" text-anchor="middle">agent skill</text>
  <text class="caption" x="678" y="412" text-anchor="middle">Every other member that needs a language or vision model asks this one rather than hard-coding a name that ages badly.</text>
</svg>
