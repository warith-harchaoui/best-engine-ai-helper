<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 560" width="1220" height="560"
     role="img" aria-labelledby="sf-title sf-desc" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="sf-title">Comment tourne une passe avant en flux : une seule couche de décodeur résidente</title>
  <desc id="sf-desc">Le checkpoint reste sur le disque en safetensors projetés en mémoire, une entrée par couche
  de décodeur. La mémoire résidente ne tient que deux choses : les embarquements, la norme finale
  puis la tête de sortie, chargés une fois et gardés ; enfin exactement une couche de décodeur. Un
  crochet d'entrée lit la couche sur le point d'être calculée directement dans le checkpoint, la
  suivante est préchargée pendant que la courante calcule, puis un crochet de sortie rend la couche
  finie au périphérique meta. Rien n'est recopié dans un répertoire de travail au préalable : une
  exécution en flux ne demande donc aucun disque libre. Ce qui doit tenir en mémoire est donc la
  couche la plus large, pas le checkpoint — raison pour laquelle un modèle de 70 milliards de
  paramètres tourne dans quelques gigaoctets au lieu de 141. Le coût est du temps : chaque jeton
  relit tout le checkpoint, ce qui place l'exécution à des secondes par jeton plutôt qu'à des
  jetons par seconde.</desc>

  <style>
    .bg{fill:#ffffff}
    .eyebrow{fill:#6b6b6b;font-size:12px;font-weight:700;letter-spacing:.12em}
    .h{font-size:19px;font-weight:700;fill:#111111}
    .panel-l{font-size:12px;font-weight:700;letter-spacing:.09em;fill:#6b6b6b}
    .n-t{font-size:15px;font-weight:700}
    .n-s{font-size:12.5px}
    .edge-l{font-size:12px;font-weight:700;fill:#5a5a5a}
    .caption{font-size:12.5px;fill:#5a5a5a;font-style:italic}

    .panel{fill:#F7F7F8;stroke:#c9c9d0;stroke-width:1.5}
    .w{fill:#E5F1F8;stroke:#0072B2;stroke-width:1.8}
    .r{fill:#DFF2EC;stroke:#009E73;stroke-width:1.8}
    .cur{fill:#FDF0E3;stroke:#E69F00;stroke-width:2.6}
    .f{fill:#FBEDE6;stroke:#D55E00;stroke-width:1.8}
    .o{fill:#F7EDF3;stroke:#CC79A7;stroke-width:2.4}

    .ink{fill:#1a1a1a}
    .k-blue{fill:#005a8d} .k-green{fill:#007254} .k-amber{fill:#8a5600}
    .k-verm{fill:#9c4400} .k-rose{fill:#9c4b7d}

    .flow{fill:none;stroke:#9a9a9a;stroke-width:2}
    .dotted{fill:none;stroke:#9a9a9a;stroke-width:1.8;stroke-dasharray:6 5}

    @media (prefers-color-scheme: dark){
      .bg{fill:#141416} .eyebrow{fill:#a0a0a6} .h{fill:#f2f2f4} .panel-l{fill:#a0a0a6}
      .edge-l{fill:#b4b4ba} .caption{fill:#a0a0a6} .ink{fill:#ececf0}
      .panel{fill:#1b1b1d;stroke:#3a3a3d}
      .w{fill:#10243d;stroke:#4da2ff} .r{fill:#0d2a22;stroke:#3ec9a1}
      .cur{fill:#33250d;stroke:#ffb52e} .f{fill:#3a1f0d;stroke:#ff8a3d}
      .o{fill:#2d1526;stroke:#e79ac4}
      .k-blue{fill:#7ab8ff} .k-green{fill:#5fd9b6} .k-amber{fill:#ffc85c}
      .k-verm{fill:#ffa972} .k-rose{fill:#f0b7d8}
      .flow{stroke:#7a7a82} .dotted{stroke:#7a7a82}
    }
  </style>

  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a9a9a"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1220" height="560"/>
  <text class="eyebrow" x="40" y="36">UNE PASSE AVANT EN FLUX</text>
  <text class="h" x="40" y="64">Une seule couche de décodeur est résidente.</text>

  <!-- the checkpoint, which never moves -->
  <rect class="panel" x="40" y="104" width="330" height="330" rx="12"/>
  <text class="panel-l" x="62" y="132">CHECKPOINT SUR DISQUE</text>
  <text class="panel-l" x="62" y="150" font-weight="400" letter-spacing="0">safetensors, projetés en mémoire</text>

  <rect class="w" x="64" y="168" width="282" height="56" rx="9"/>
  <text class="n-t ink" x="205" y="202" text-anchor="middle">couche 0</text>
  <rect class="w" x="64" y="238" width="282" height="56" rx="9"/>
  <text class="n-t ink" x="205" y="272" text-anchor="middle">couche 1</text>
  <text class="n-t k-blue" x="205" y="322" text-anchor="middle">⋮</text>
  <rect class="w" x="64" y="344" width="282" height="56" rx="9"/>
  <text class="n-t ink" x="205" y="378" text-anchor="middle">couche N</text>

  <text class="caption" x="205" y="424" text-anchor="middle" font-size="11.5">aucune copie de travail — lu sur place</text>

  <!-- resident memory, which is the whole point -->
  <rect class="panel" x="470" y="104" width="380" height="330" rx="12"/>
  <text class="panel-l" x="492" y="132">MÉMOIRE RÉSIDENTE</text>

  <rect class="r" x="494" y="150" width="332" height="78" rx="9"/>
  <text class="n-t ink" x="660" y="180" text-anchor="middle">embarquements + norme finale + tête</text>
  <text class="n-s k-green" x="660" y="204" text-anchor="middle">chargés une fois, gardés</text>

  <rect class="cur" x="494" y="268" width="332" height="86" rx="9"/>
  <text class="n-t k-amber" x="660" y="300" text-anchor="middle">exactement UNE</text>
  <text class="n-t k-amber" x="660" y="324" text-anchor="middle">couche de décodeur</text>

  <text class="caption" x="660" y="402" text-anchor="middle" font-size="11.5">la suivante charge pendant que celle-ci calcule ;</text>
  <text class="caption" x="660" y="422" text-anchor="middle" font-size="11.5">la couche la plus large est l'exigence</text>

  <!-- what the hooks do -->
  <path class="dotted" d="M346 196 Q420 196 420 290 L486 290" marker-end="url(#c)"/>
  <text class="edge-l" x="404" y="186" text-anchor="middle">crochet d'entrée</text>

  <path class="dotted" d="M346 266 Q430 266 430 300 L486 300" marker-end="url(#c)"/>
  <text class="edge-l" x="412" y="248" text-anchor="middle">préchargée</text>

  <path class="dotted" d="M346 372 Q440 372 440 316 L486 316" marker-end="url(#c)"/>

  <!-- and what happens after -->
  <path class="flow" d="M826 290 L944 290" marker-end="url(#c)"/>
  <text class="edge-l" x="885" y="278" text-anchor="middle">crochet de sortie</text>
  <rect class="f" x="948" y="262" width="232" height="58" rx="9"/>
  <text class="n-t ink" x="1064" y="297" text-anchor="middle">rendue à meta</text>

  <path class="flow" d="M660 228 L660 252" marker-end="url(#c)"/>

  <path class="flow" d="M826 190 Q900 190 900 160 L944 160" marker-end="url(#c)"/>
  <path class="flow" d="M826 340 Q900 340 900 172 L944 172" marker-end="url(#c)"/>
  <rect class="o" x="948" y="132" width="232" height="58" rx="9"/>
  <text class="n-t ink" x="1064" y="167" text-anchor="middle">logits</text>

  <text class="caption" x="40" y="490">La mémoire cesse d'être la contrainte, le temps le devient : chaque jeton relit tout le checkpoint, donc l'unité est la seconde par jeton.</text>
  <text class="caption" x="40" y="514">C'est le marché que ce moteur existe pour offrir, puis la raison pour laquelle il n'est jamais choisi quand un modèle tient déjà.</text>
</svg>
