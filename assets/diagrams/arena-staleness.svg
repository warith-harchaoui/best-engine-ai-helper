<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440"
     role="img" aria-labelledby="ar-title ar-desc" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="ar-title">Why the Arena axis usually stays empty, and why that is the right answer</title>
  <desc id="ar-desc">Four candidate sources of LM Arena ratings are tried in turn, and as surveyed on
  19 October 2026 each one fails for its own reason: the official site answers HTTP 403 behind an
  anti-bot wall; one community mirror returns an empty leaderboard object; a paid scraping service is
  refused on principle because it would route the request through a third party; and the one mirror
  that does work last published on 22 May 2025, which is 515 days old and past the 120-day staleness
  bar. The adapter therefore merges nothing and says why, because a rating from a previous generation
  of models would rank 2025's models above 2026's, which is worse than having no rating at all.</desc>

  <style>
    .lane       { fill: #ffffff; stroke: #e0e0e0; stroke-width: 1.5; }
    .src        { fill: #F8F8F8; stroke: #9a9a9a; stroke-width: 1.5; }
    .src-name   { font-size: 14px; font-weight: 600; fill: #111111; }
    .src-why    { font-size: 12px; fill: #5a5a5a; }
    .verdict    { font-size: 11.5px; font-weight: 700; letter-spacing: .04em; }
    .dead       { fill: #C62B21; }
    .refused    { fill: #A8520B; }
    .stale      { fill: #8a6d00; }
    .pill-dead    { fill: #FDECEA; stroke: #C62B21; stroke-width: 1.2; }
    .pill-refused { fill: #FDF0E3; stroke: #A8520B; stroke-width: 1.2; }
    .pill-stale   { fill: #FFF9E0; stroke: #8a6d00; stroke-width: 1.2; }
    .gate-box   { fill: #FFF4E0; stroke: #FF9500; stroke-width: 2; }
    .out-box    { fill: #1A5FB4; stroke: #124a8f; stroke-width: 2; }
    .h          { font-size: 15px; font-weight: 700; fill: #111111; }
    .on-dark    { fill: #ffffff; }
    .on-dark-sub{ fill: #d8e8ff; }
    .flow       { fill: none; stroke: #9a9a9a; stroke-width: 2; }
    .caption    { font-size: 12.5px; fill: #5a5a5a; font-style: italic; }
    .eyebrow    { fill: #6b6b6b; font-size: 12.5px; font-weight: 600; letter-spacing: .08em; }
    .mono       { font-family: 'Roboto Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }

    @media (prefers-color-scheme: dark) {
      .lane     { fill: #1b1b1d; stroke: #3a3a3d; }
      .src      { fill: #2a2a2e; stroke: #6f6f76; }
      .src-name { fill: #f2f2f4; }
      .src-why  { fill: #b4b4ba; }
      .h        { fill: #f2f2f4; }
      .flow     { stroke: #7a7a82; }
      .caption  { fill: #a0a0a6; }
      .eyebrow  { fill: #a0a0a6; }
      .gate-box { fill: #3a2d12; stroke: #FF9500; }
      .pill-dead    { fill: #3b1512; stroke: #F2635A; }
      .pill-refused { fill: #38220c; stroke: #E8923F; }
      .pill-stale   { fill: #332b08; stroke: #FFCC00; }
      .dead     { fill: #F2635A; }
      .refused  { fill: #E8923F; }
      .stale    { fill: #FFCC00; }
    }
  </style>

  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a9a9a"/>
    </marker>
  </defs>

  <text class="eyebrow" x="40" y="34">EVERY ARENA SOURCE, TRIED IN TURN · SURVEYED 2026-10-19</text>

  <!-- ── source rows ── -->
  <rect class="lane" x="40" y="48" width="560" height="248" rx="10"/>

  <!-- 1 -->
  <rect class="src" x="60" y="66" width="340" height="48" rx="8"/>
  <text class="src-name" x="76" y="86">lmarena.ai</text>
  <text class="src-why"  x="76" y="104">the official board · no public API</text>
  <rect class="pill-dead" x="416" y="76" width="166" height="28" rx="14"/>
  <text class="verdict dead" x="499" y="94" text-anchor="middle">HTTP 403 · ANTI-BOT WALL</text>

  <!-- 2 -->
  <rect class="src" x="60" y="124" width="340" height="48" rx="8"/>
  <text class="src-name" x="76" y="144">oolong-tea-2026</text>
  <text class="src-why"  x="76" y="162">community mirror</text>
  <rect class="pill-dead" x="416" y="134" width="166" height="28" rx="14"/>
  <text class="verdict dead" x="499" y="152" text-anchor="middle">EMPTY LEADERBOARD</text>

  <!-- 3 -->
  <rect class="src" x="60" y="182" width="340" height="48" rx="8"/>
  <text class="src-name" x="76" y="202">Apify</text>
  <text class="src-why"  x="76" y="220">works, but a paid token and a third-party hop</text>
  <rect class="pill-refused" x="416" y="192" width="166" height="28" rx="14"/>
  <text class="verdict refused" x="499" y="210" text-anchor="middle">REFUSED ON PRINCIPLE</text>

  <!-- 4 -->
  <rect class="src" x="60" y="240" width="340" height="48" rx="8"/>
  <text class="src-name" x="76" y="260">lmarena-history</text>
  <text class="src-why"  x="76" y="278">the one mirror that answers · 319 ratings</text>
  <rect class="pill-stale" x="416" y="250" width="166" height="28" rx="14"/>
  <text class="verdict stale" x="499" y="268" text-anchor="middle">515 DAYS OLD</text>

  <!-- ── the staleness gate ── -->
  <path class="flow" d="M600 172 L646 172" marker-end="url(#a2)"/>

  <rect class="gate-box" x="650" y="104" width="300" height="76" rx="10"/>
  <text class="h"       x="800" y="132" text-anchor="middle">Older than 120 days?</text>
  <text class="src-why" x="800" y="154" text-anchor="middle">a rating from a previous generation of models</text>
  <text class="src-why" x="800" y="170" text-anchor="middle">would rank 2025 above 2026</text>

  <path class="flow" d="M800 180 L800 218" marker-end="url(#a2)"/>

  <rect class="out-box" x="650" y="220" width="300" height="84" rx="10"/>
  <text class="h on-dark"    x="800" y="248" text-anchor="middle">Merge nothing. Say why.</text>
  <text class="src-why on-dark-sub" x="800" y="270" text-anchor="middle">the axis stays empty, and the user is told</text>
  <text class="src-why on-dark-sub mono" x="800" y="290" text-anchor="middle">"newest snapshot is 515 days old"</text>

  <text class="caption" x="500" y="344" text-anchor="middle">An empty axis the caller knows about beats a populated one they cannot trust.</text>
  <text class="caption" x="500" y="368" text-anchor="middle">Refusing is the deliverable here — the adapter is ready for the day a fresh mirror appears.</text>

  <text class="src-why" x="500" y="404" text-anchor="middle">Where it does pay off: matched against the bundled catalogs, the Arena covers 6 of 10 cloud models and 3 of 20 local ones.</text>
  <text class="src-why" x="500" y="422" text-anchor="middle">It rates large conversational models — which is most of a price list, and a minority of a local catalog.</text>
</svg>
