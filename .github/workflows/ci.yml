name: ci

# Gentle, deterministic gate: install the package + dev deps, then ruff lint
# and pytest on the supported Python versions. The tests never call a live
# model daemon (the pull / validate model loops are covered by graceful
# fall-through tests, not live calls), so CI needs no Ollama. Intentionally
# minimal.

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q
