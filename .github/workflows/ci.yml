name: ci

# The light lane: lint, types, tests, and the two consistency checks that cost
# nothing. Every step shells out to scripts/gate.sh, the same script the
# pre-push hook runs, so "it passed locally" and "it passed in CI" are claims
# about one set of commands rather than two that happen to resemble each other.
#
# What is deliberately NOT here:
#
#   Git LFS. Only the wheel inspection reads the real ONNX bytes, and that
#   moved to packaging.yml. A plain checkout leaves a pointer stub, which the
#   test suite never opens (onnxruntime is mocked, not installed).
#
#   Building a distribution. Installing build + twine and producing a wheel on
#   every commit spends minutes on an artifact that only the packaging inputs
#   can invalidate -- so packaging.yml watches those inputs instead, and also
#   runs on tags and on demand.
#
#   The [cloud] / [filtered] extras. The tests exercise their "installed" and
#   "not installed" branches by monkeypatching sys.modules, not by pulling in
#   the real (heavy) packages.
#
#   Ollama. No test calls a live model daemon; the pull / validate loops are
#   covered by mocked and fall-through tests.

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Re-run the gate against main without having to invent a commit for it.
  workflow_dispatch:

# Cancel a still-running run for the same branch/PR when a new push lands, so
# a quick string of fixup pushes doesn't queue up redundant runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  gate:
    runs-on: ubuntu-latest
    # The sweep takes about a minute. The cap is there so a hung job is
    # cancelled by the clock instead of holding a runner for six hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Super-light gate: one Python; the full 3.10-3.12 sweep runs locally
        # before push.
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # Without this the pip cache is keyed on requirements*.txt alone, so
          # a dependency edit in pyproject.toml restores a stale wheel set.
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # torch arrives through `[imagine,lightweight]` below -- the gate
          # installs the runtime extras on purpose, because the modules that
          # need them are modules this suite tests and a lane that skipped
          # them would hold a 90% coverage floor by not looking. PyPI's Linux
          # torch wheel is the CUDA build: gigabytes of nvidia-* payload for a
          # runner with no GPU that never loads a model. Pre-installing the CPU
          # build satisfies the requirement first, so the project install below
          # resolves against it instead of fetching the CUDA one.
          #
          # `--index-url`, not `--extra-index-url`: with two indexes offering
          # the same version, which one pip picks is not a documented
          # guarantee, and a CI lane whose download size depends on resolver
          # luck is a CI lane that gets slow again without anyone editing it.
          # This is PyTorch's own published install command, and their index
          # also serves torch's dependencies, so it stands alone.
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[imagine,lightweight]" -r requirements-dev.txt
      # mypy spends most of its time re-reading the dependency stubs it read
      # last run: a cold cache cost 13s of a 69s job, which is the second
      # largest item after installing. The key carries the commit so every run
      # writes a fresh entry (GitHub will not overwrite an existing key), and
      # the restore-keys prefix is what actually hands the previous run's
      # cache over. Pinned to the dependency set, because stubs are what is
      # cached: a dependency edit must not restore a cache describing the
      # versions before it.
      - name: Cache mypy
        uses: actions/cache@v6
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'requirements-dev.txt') }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'requirements-dev.txt') }}-
      # One stage per step so a failure is named by the step that failed,
      # rather than buried in one long log. The commands live in the script.
      - name: Dependencies
        run: ./scripts/gate.sh deps
      - name: Lint
        run: ./scripts/gate.sh lint
      - name: Types
        run: ./scripts/gate.sh types
      - name: Tests
        run: ./scripts/gate.sh tests
      - name: Version / CHANGELOG consistency
        run: ./scripts/gate.sh version

  floor:
    name: Floor (py3.10 installs and imports)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `requires-python = ">=3.10"` is a promise to anyone running `pip install`:
    # on 3.10 this package installs and imports. Nothing in the suite checked
    # it -- sixteen members made the promise and only speaker-helper ran the
    # version, so the rest was a claim with no evidence behind it. Verified by
    # hand across all seventeen before this job was added, so it starts green.
    #
    # Install and import, deliberately not the test suite. The tests use 3.11
    # features legitimately (`tomllib`, behind a `tomli` fallback), and gating
    # the floor on dev-only concerns would fail this job for reasons that have
    # nothing to do with the promise.
    #
    # A PLAIN install, which is the one this job exists to describe: no
    # extras, so no deep-learning runtime, which is the shape every caller who
    # only wants a recommendation gets. The CPU-wheel pre-install that used to
    # stand here went with the base torch dependency -- there is nothing left
    # for it to pre-empt, and leaving it would have downloaded 196 MB to prove
    # a light install is light.
    #
    # The job still earns its minute: it is the only place that proves the
    # dependency set resolves on the oldest Python the package promises.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install .
      - run: python -c "import best_engine_ai_helper"
      # Here this says the weaker thing -- nothing heavy is installed on this
      # lane, so of course nothing heavy is imported -- and it is still worth
      # a second: a plain install that reached for torch at import time would
      # now raise ImportError rather than merely be slow. The real version of
      # this promise, on an interpreter that HAS torch, is
      # `tests/test_packaging.py::...lazily`, which runs on the gate lane
      # because that lane installs `[imagine,lightweight]`.
      - run: |
          python - <<'PY'
          import sys
          import best_engine_ai_helper  # noqa: F401
          heavy = sorted(m for m in ("torch", "airllm", "transformers") if m in sys.modules)
          assert not heavy, f"importing the package pulled in {heavy}"
          print("OK: the package imports without torch")
          PY
