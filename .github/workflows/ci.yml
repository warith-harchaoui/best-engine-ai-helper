name: ci

# Deterministic gate: install the package (with the [mcp] extra, which pulls in
# [api] too, so the FastAPI GUI surface AND the MCP surface are both importable
# under --doctest-modules) + dev deps, verify the dependency set is coherent
# (pip check), then ruff lint, mypy types, and pytest with a coverage floor on
# the supported Python versions. The tests never call a live model daemon (the
# pull / validate model loops are covered by mocked / fall-through tests), so CI
# needs no Ollama.

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Super-light gate: one Python; the full sweep runs locally before push.
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mcp]" -r requirements-dev.txt
      - name: Pip check
        # Catch incompatible pinned dependencies before they bite at runtime.
        run: python -m pip check
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy best_engine_ai_helper
      - name: Pytest
        # A failing test or a coverage regression below the floor blocks merge.
        run: pytest -q --cov=best_engine_ai_helper --cov-report=term-missing --cov-fail-under=90
