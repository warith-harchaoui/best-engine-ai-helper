[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "best-engine-ai-helper"
version = "1.10.0"
description = "Pick and pull the best local LLM/VLM for the current hardware."
authors = [{name = "Warith Harchaoui", email = "warithmetics@deraison.ai"}]
license = {text = "BSD-3-Clause"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # The command line, and no longer optional: this package ships exactly one
    # CLI and it is built with click, so the dependency cannot be an extra.
    # Capped below 9 like every other member of the suite -- a major click
    # release is free to change group/option semantics under us.
    "click>=8.1,<9",
    # Best-effort language ID for recommend.parse_task's task-description
    # quality check: offline, deterministic, no model call.
    "langdetect>=1.0.9",
    # >=2.3.0 for os_helper.hardware_utils's live-load fields (hardware_info()'s
    # cpu.percent / available_ram_gb / disk / gpu_utilization_percent, plus the
    # standalone cpu_percent()/available_ram_gb()/disk_usage_gb()/
    # gpu_utilization_percent() functions) that detect.server_load() reads —
    # the `--live` CLI/API flag. detect.py delegates ALL raw hardware probing
    # to os_helper instead of doing it directly.
    # Cap at <4, not <3: os-helper 3.0.0 dropped its own command line and
    # nothing here ever called it, so the major bump is not breaking for
    # this package.
    "os-helper>=2.9.0,<4",
    # detect.py imports this directly for the running-vLLM-process scan
    # (server_load()); already a transitive os-helper dep, declared directly
    # here too since the code imports it by name, not just by luck.
    "psutil>=5.9",
    "pyyaml>=6.0",
    "requests>=2.31",
    # FastAPI HTTP surface + minimal browser GUI (best_engine_ai_helper.api /
    # .gui) and the MCP surface (best_engine_ai_helper.mcp) — both part of the
    # default install, not opt-in extras.
    "fastapi>=0.111,<1",
    "uvicorn>=0.30,<1",
    "fastapi-mcp>=0.3,<1",
    # Cap the MCP SDK below 2.0: fastapi-mcp 0.4.0 declares only `mcp>=1.12`
    # (no upper bound), but mcp 2.0.0 changed the low-level `Server.__init__`
    # signature and breaks fastapi-mcp at import. Pin to the 1.x line until
    # fastapi-mcp ships a 2.x-compatible release (same issue hit md2star).
    "mcp>=1.12,<2",
]

[project.optional-dependencies]
# Everything mode: cloud needs on top of core `requests` (already enough to
# talk to any OpenAI-compatible/Anthropic/Gemini provider). Retry/backoff for
# chat(retries=…), memoization for chat(cache=True), PII augmentation for the
# pseudonymizer (privacy.py), and an OS-keychain fallback for a cloud API key
# when its env var isn't set (see llm._cloud_api_key) — the env var /
# settings.yaml stays the primary, always-available path either way.
cloud = [
    "tenacity>=8,<10",
    "wallet-helper>=0.1",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "Faker>=25",
    "keyring>=24",
]
# The deep-learning runtime, and it is not in the base install.
#
# This package's job is to say WHICH model to run. Everything that decides
# that -- the catalogues, the scoring, the hardware probe, the footprint and
# timing arithmetic behind `rank`, `imagine_rank` and `imagine_pick` -- is
# plain Python over a table, and runs with none of what follows installed.
# Only the four modules that actually RUN a model need it (`streaming.py` and
# `offload.py` for layer streaming, `imagine.py` for text-to-image,
# `safety.py` for CLIP screening via `[filtered]` below), and all four import
# it lazily, inside the functions that use it.
#
# It was core for three days and the measurement is why it is not any more: a
# base install is a few megabytes, these are 196 MB on a processor-only wheel
# and gigabytes of nvidia-* payload when pip takes the CUDA build -- which on
# Linux it does by default. A caller asking which model fits their laptop
# should not download a deep-learning stack to be told. The capability probes
# (`imagine.available`, `offload.available`) already answer False cleanly and
# name what to install, because they were written for a stripped container
# and a Mac without `mlx` before they were ever needed for this.
lightweight = [
    "torch>=2.4",
    "transformers>=4.49,<7",
    "accelerate>=0.30",
    "safetensors>=0.4",
    "huggingface-hub>=0.24",
]
imagine = [
    "diffusers>=0.31,<1",
    "best-engine-ai-helper[lightweight]",
]
# `[airllm]` was published in release notes and is in a lockfile somewhere.
# It was an empty alias while layer streaming was core; now that the runtime
# is an extra again, the old spelling resolves to the new one rather than to
# nothing, so a lockfile written against it still installs something that
# works.
airllm = ["best-engine-ai-helper[lightweight]"]
# Everything a caller needs to run a model rather than choose one.
generate = ["best-engine-ai-helper[imagine,lightweight]"]
# NSFW / policy filtering for chat(safety=...) (safety.py): a DistilBERT model
# fine-tuned for NSFW text (via transformers), and LAION's CLIP-based NSFW
# image detector -- transformers for the CLIP ViT-L/14 encoder, onnxruntime
# for the bundled classifier head (models/clip_nsfw_vit_l14.onnx, no
# TensorFlow/autokeras/runtime-download needed, see safety.py's module
# docstring). Optional -- text degrades to a crude keyword heuristic without
# it; images degrade to "unavailable" (never a fabricated verdict) without it.
filtered = [
    # Listed in full because this extra states what IT needs. They overlap
    # with `[lightweight]` above and a reader of this block should not have
    # to know that, nor rely on it: installing `[filtered]` alone has to be
    # enough.
    "transformers>=4.30",
    # transformers alone does not pull in an inference backend -- without
    # this, both classifiers below load their tokenizer/config fine but
    # fail at the first real inference call. CPU-friendly on every platform
    # pip resolves a wheel for; a GPU install already on the machine (CUDA
    # index, conda, etc.) is unaffected, this is just the floor version.
    "torch>=2.0",
    "onnxruntime>=1.17",
    "Pillow>=9.0",
]

[project.scripts]
# One command line, built with click. The argparse twin that used to ship
# beside it (`-argparse`) was removed in 1.9.0: a suffix naming the parsing
# library describes the implementation, not the interface.
best-engine-ai-helper = "best_engine_ai_helper.cli:main"
# HTTP API + MCP server.
best-engine-ai-helper-mcp = "best_engine_ai_helper.mcp:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["best_engine_ai_helper*"]

# Patterns here resolve relative to a PACKAGE directory, never to the repo
# root. The previous version listed these same names under "*" while the files
# sat beside the package — so the patterns matched nothing and the wheel
# shipped no data at all. They now live in best_engine_ai_helper/data/.
[tool.setuptools.package-data]
"best_engine_ai_helper" = [
    "data/*.yaml",
    # The prompts namespace still lives in the YAML; the GUI's strings are in
    # the gettext catalogues beside it. Both have to be declared or neither
    # travels in the wheel — which is the bug this package shipped up to 1.5.0.
    "locales/*.yaml",
    "locales/*/LC_MESSAGES/*.po",
    "locales/*/LC_MESSAGES/*.mo",
    "static/**",
    "models/*.onnx",
    "models/NOTICE.md",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# gui.py is a single embedded HTML/Tailwind/JS template string, not Python
# prose; line length there follows the markup, not PEP 8.
"best_engine_ai_helper/gui.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
# Collect the unit suite AND the docstring Examples: the coding standard puts a
# runnable Example on every function, so `--doctest-modules` keeps them honest.
testpaths = ["best_engine_ai_helper", "tests"]
addopts = "--doctest-modules"
