[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "best-engine-ai-helper"
version = "1.0.0"
description = "Pick and pull the best local LLM/VLM for the current hardware."
authors = [{name = "Warith Harchaoui", email = "warith.harchaoui@deraison.ai"}]
license = {text = "BSD-3-Clause"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "os-helper>=2.0.0,<3",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# FastAPI HTTP surface + minimal browser GUI (best_engine_ai_helper.api / .gui).
api = [
    "fastapi>=0.111,<1",
    "uvicorn>=0.30,<1",
]
# cloud branch (Phase 6) extras — each optional, core stays light.
# Failover retry/backoff for llm.chat(retries=…).
cloud = [
    "tenacity>=8,<10",
]
# Persistent memoization + single-flight for llm.chat(cache=True): never pay for
# an identical paid call twice.
cache = [
    "wallet-helper>=0.1",
]
# Deterministic PII augmentation for the local-LLM pseudonymizer (privacy.py).
privacy = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "Faker>=25",
]

[project.scripts]
best-engine-ai-helper = "best_engine_ai_helper.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["best_engine_ai_helper*"]

[tool.setuptools.package-data]
"*" = ["models.yaml", "hardware.yaml", "usages.yaml"]
"best_engine_ai_helper" = ["static/**"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# gui.py is a single embedded HTML/Tailwind/JS template string, not Python
# prose; line length there follows the markup, not PEP 8.
"best_engine_ai_helper/gui.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
# Collect the unit suite AND the docstring Examples: the coding standard puts a
# runnable Example on every function, so `--doctest-modules` keeps them honest.
testpaths = ["best_engine_ai_helper", "tests"]
addopts = "--doctest-modules"
