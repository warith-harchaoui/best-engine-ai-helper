[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "best-engine-ai-helper"
version = "0.4.0"
description = "Pick and pull the best local LLM/VLM for the current hardware."
authors = [{name = "Warith Harchaoui", email = "warith.harchaoui@deraison.ai"}]
license = {text = "BSD-3-Clause"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "os-helper>=1.5.0",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# FastAPI HTTP surface + minimal browser GUI (best_engine_ai_helper.api / .gui).
api = [
    "fastapi>=0.111,<1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
best-engine-ai-helper = "best_engine_ai_helper.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["best_engine_ai_helper*"]

[tool.setuptools.package-data]
"*" = ["models.yaml", "hardware.yaml"]
"best_engine_ai_helper" = ["static/**"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# gui.py is a single embedded HTML/Tailwind/JS template string, not Python
# prose; line length there follows the markup, not PEP 8.
"best_engine_ai_helper/gui.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
