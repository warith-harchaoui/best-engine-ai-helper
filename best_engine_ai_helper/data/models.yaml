# --- Embedding models (kind: embed) ---------------------------------------
# Text embedders for the multi-granular ann-router index, NOT chat models: the
# LLM/VLM benchmark picker ignores kind: embed, and the embeddings usage (F3)
# selects among these by memory fit, ranked on the `mteb` retrieval score (MTEB
# average). structured_output is irrelevant to an embedder. Sizes are the Ollama
# tag footprints; scores are MTEB-average estimates pending a rescrape.
