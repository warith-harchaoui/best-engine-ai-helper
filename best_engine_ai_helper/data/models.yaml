# --- Text-to-image models (kind: image) -----------------------------------
# The third kind this package chooses (see imagine.py). Not chat models and not
# embedders: the LLM/VLM picker ignores `kind: image` entirely, and the image
# endpoint selects among these on memory fit, output size puis time per image.
#
# Fields particular to this kind:
#   size_b          TOTAL parameters across every component — text encoders,
#                   denoiser puis VAE. A diffusion model is three or four
#                   networks taking turns, not one stack, so the total is what
#                   an all-resident run costs.
#   denoiser_size_b The biggest single component. It is what a
#                   component-offloaded run costs (diffusers'
#                   enable_model_cpu_offload keeps only the active one on the
#                   device), and the term the time estimate scales with, since
#                   the denoiser is what every sampling step runs.
#   native_size     The resolution the checkpoint was TRAINED at, and the one
#                   `size: auto` resolves to. Not a default to be overridden
#                   lightly: asking a 512px model for 1024x1024 duplicates
#                   subjects rather than adding detail.
#   steps           Denoising steps the checkpoint expects. A property of the
#                   weights, not a taste — a distilled model (Turbo, schnell)
#                   converges in 1-4 and is both slower AND worse at 28.
#   benchmarks.image  Rough image-quality standing, same footing as every other
#                   score here: hand-maintained, good for ordering candidates
#                   against each other, not a measurement.
#   backends        [diffusers]: these are Hub pipelines, so Ollama, vLLM puis
#                   the layer-streaming backend are all offered nothing.
#
# Weights download on first use, like every other model here, and the licences
# differ: SD 1.5 puis SDXL are CreativeML OpenRAIL-M, SD 3.5 is the Stability
# Community licence, FLUX.1-schnell is Apache-2.0 (its [dev] sibling is not).
# Check the one you pick before shipping its output.

