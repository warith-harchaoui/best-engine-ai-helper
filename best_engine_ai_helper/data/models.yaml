# Bundled seed catalog. Hand-maintained before each release.
# Auto-refresh (catalog update) adds entries to
# ~/.best-engine-ai-helper/catalog_cache.yaml without modifying this file.
#
# External sources to consult when curating entries / benchmark scores:
#   - Open LLM Leaderboard v2 (general, math) — huggingface.co/spaces/open-llm-leaderboard
#   - OpenVLM Leaderboard (vision, ocr)
#   - Ollama registry API (pull tags, sizes)
#   - HuggingFace Hub API (vllm_id, sizes)
#   - ApXML LLM directory (open-weight, VRAM/compute needs, coding benchmarks):
#     https://apxml.com/models?modelType=open_weight  (check regularly)
#
# Fields:
#   id          Ollama pull tag (name:tag)
#   kind        llm | vlm  (VLM implies text capability too)
#   size_b      Parameter count in billions
#   quant       Quantization: Q4_K_M | Q8_0 | FP16 | Q2_K
#   disk_gb     On-disk footprint in GB
#   ram_gb      Peak inference RAM estimate (disk_gb × quant overhead)
#   benchmarks  Scores from public leaderboards (null = not measured)
#     general   Open LLM Leaderboard v2 average (IFEval+BBH+MATH+GPQA+MUSR+MMLU-Pro)
#     vision    OpenVLM Leaderboard average
#     ocr       OCRBench
#     code      EvalPlus HumanEval+
#     math      MATH sub-score from Open LLM Leaderboard v2
#   structured_output  Whether the model reliably honours Ollama's JSON-schema
#                      structured output (format=<schema>). Qwen3-VL reasoning
#                      models return an EMPTY response under it (verified on
#                      qwen3-vl:8b), so they are unusable for the helper's
#                      structured tasks (intent, edit proposals, visual critique)
#                      even though their raw benchmarks look strong. The helper
#                      routes every structured call through a schema, so the
#                      recommender treats a false here as disqualifying for auto-
#                      selection. Default (absent) is treated as true.
#   vllm_id     HuggingFace model ID for vLLM, null if unavailable. The SAME id
#               the airllm (layer-streaming) backend downloads and splits, so
#               `hf_id` is accepted as an alias where that reads better.
#   fetched_at  ISO 8601 date of last external refresh; null = bundled seed
#
# Fields read only by the layer-streaming backend (see offload.py). All optional:
#   layers      Decoder depth (`num_hidden_layers` in the HF config). THE divisor
#               of the streaming footprint -- resident memory is one shard, and a
#               shard is the checkpoint over this number. Absent, it is
#               interpolated from size_b for a dense model and REFUSED for a MoE
#               one (DeepSeek-V3 is 671B across 61 layers; the dense trend would
#               predict twice that, in the direction that over-promises).
#   dtype       Dtype the HF checkpoint is STORED in: bf16 (default), fp16, fp8,
#               int8. Sets bytes-per-parameter, and so both the shard size and
#               the per-token disk traffic. Distinct from `quant`, which names a
#               GGUF quantisation of an Ollama tag -- a file airllm never reads.
#   moe         true for a mixture-of-experts checkpoint. Only effect: without a
#               declared `layers`, depth is refused rather than guessed.
#   backends    Which backends this entry is OFFERED to (default: all of them).
#               `[airllm]` marks a streaming-only candidate: curated for layer
#               streaming, and deliberately kept out of the Ollama/vLLM pools so
#               a 141 GB checkpoint can never become a last-resort pick on a
#               machine with 16 GB of RAM.

- id: qwen2.5:3b
  kind: llm
  size_b: 3
  quant: Q4_K_M
  disk_gb: 2.0
  ram_gb: 2.2
  benchmarks:
    general: 62
    vision: null
    ocr: null
    code: null
    math: null
  notes: "Text-only; very small footprint. Reliable structured JSON output."
  structured_output: true
  vllm_id: Qwen/Qwen2.5-3B-Instruct
  fetched_at: null

