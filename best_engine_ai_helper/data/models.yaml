# --- Streaming-only giants (backends: [airllm]) ---------------------------
# Models no machine in this package's target range can LOAD, and every one of
# which it can nonetheless RUN by streaming the layers off disk one at a time
# (see offload.py and `best-engine-ai-helper airllm`).
#
# Three things to know before reaching for one:
#
# 1. The cost is time, and the honest unit is seconds per token. Each token
#    re-reads the whole checkpoint from storage, so a 70B at bf16 on a 4 GB/s
#    NVMe drive decodes at about 0.024 tok/s -- roughly forty seconds a token.
#    airllm's 4-bit compression divides that by four. These are batch jobs:
#    an overnight evaluation, one hard question, a quality reference to compare
#    a small local model against. Not a chat window.
# 2. The binding constraint is DISK, not memory. `disk_gb` below is the
#    download; the split needs about twice that free at once (offload
#    .disk_required_gb). A 405B model is a 810 GB download before it is
#    anything else.
# 3. No structured output. airllm exposes raw `generate`, with none of
#    Ollama's JSON-schema enforcement, so `structured_output: false` is a fact
#    about the backend rather than about the weights. Every schema-driven task
#    in the suite needs an Ollama model; these answer prose.
#
# `ram_gb` is what a CONVENTIONAL backend would need to hold the model
# resident -- deliberately truthful, so a direct `score.rank()` call reports
# these as not fitting instead of being surprised by them. The streaming
# footprint is computed from `layers`, and runs from 4.9 GB (the 70B) to 28 GB
# (DeepSeek-V3) with airllm's prefetch on. Turning prefetch off roughly halves
# each figure, at some cost in an already slow decode.
#
# Benchmark figures are seed estimates from each model's own release notes and
# public leaderboards at time of writing, on the same footing as the rest of
# this file: good for comparing candidates, not for a procurement decision.

- id: llama3.3:70b
  kind: llm
  size_b: 70
  layers: 80
  dtype: bf16
  quant: BF16
  disk_gb: 141
  ram_gb: 155
