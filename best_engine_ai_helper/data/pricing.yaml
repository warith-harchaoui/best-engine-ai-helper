# Seed catalog for PAID cloud models: cost (for observe.py's usage ledger)
# AND benchmark quality (for cloud_catalog.py's auto-pick, the cloud
# counterpart of models.yaml's local picker). Hand-maintained, same spirit as
# models.yaml: refresh when a provider reprices or ships a new flagship,
# never treat these numbers as exact.
#
# USD per 1 million tokens, published list prices as of this writing. Local
# backends (ollama, vllm) are never priced here -- they are hardcoded free in
# observe.py, since there is no paid API call to price. Every model below IS
# reachable today: engine.resolve(mode="cloud") on main routes a real request
# through llm.chat's OpenAI-compatible / Anthropic / Gemini transports, and
# observe.py prices every call against this table.
#
# Update cost when a provider changes pricing; each call's cost is an
# estimate (character-based token approximation, see observe.py's
# _CHARS_PER_TOKEN) until real provider `usage` token counts are wired in.
#
# Fields (mirrors models.yaml where the concept transfers):
#   provider    One of engine._CLOUD_BASE_URLS's keys (openai, anthropic,
#               gemini, mistral, openrouter, together, azure).
#   kind        llm | vlm  (vlm implies text capability too, same rule as
#               models.yaml; cloud_catalog.rank_cloud filters the same way
#               score.rank does for the local catalog).
#   structured_output  Whether the provider's API reliably honours a JSON
#               schema / JSON-mode request. Absent is treated as true.
#   benchmarks  Approximate public-leaderboard scores (MMLU-style general,
#               HumanEval-style code, MATH, MMMU-style vision; ocr is null
#               everywhere below -- no OCR-specific cloud benchmark is
#               consistently published). SEED VALUES: approximate, sourced
#               from each provider's own release benchmarks and third-party
#               leaderboards at time of writing, not re-verified per release.
#               Good enough to rank candidates against each other; refresh
#               before using them for a procurement decision.
#   input_per_1m / output_per_1m  USD per 1M tokens, list price.

# NO `as_of:` HERE, DELIBERATELY. The loader supports the key and
# `catalog_as_of()` reads it, but these numbers were written down from
# recollection rather than verified against a source on a particular day, so
# there is no date to put. Stamping the last commit that touched this file
# would say "verified on" about an edit, which is exactly the kind of claim
# this project spends its time removing.
#
# The consequence is intended: `staleness_note()` reports that the table
# carries no date, on every cloud surface, until somebody refreshes it.
# `best-engine-ai-helper catalog update --cloud` pulls list prices and context
# lengths from LiteLLM's public table and stamps each entry with a real
# `fetched_at`, which then supersedes this absence.
#
# Benchmarks are NOT refreshed by that command: the price source publishes
# none, and this file will not carry a quality score nobody measured. They stay
# hand-maintained, and a refresh preserves them.

models:
  gpt-4o:
    provider: openai
    kind: vlm
    structured_output: true
    benchmarks: {general: 88, code: 90, math: 76, ocr: null, vision: 69}
    input_per_1m: 2.50
    output_per_1m: 10.00
  gpt-4o-mini:
    provider: openai
    kind: vlm
    structured_output: true
    benchmarks: {general: 82, code: 87, math: 70, ocr: null, vision: 59}
    input_per_1m: 0.15
    output_per_1m: 0.60
